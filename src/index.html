<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="" />
    <meta name="author" content="Karilyn Bremiller" />
    <meta name="keywords" content="spots" />
    <link rel="icon" href="./images/favicon.ico" type="image/x-icon" />
    <title>Spots</title>
  </head>
  <body class="page">
    <header class="header">
      <img
        src="<%=require('./images/spots-logo.svg')%>"
        alt="Spot Logo"
        class="header__logo"
      />
    </header>
    <main class="content">
      <section class="profile page__section">
        <div class="profile__avatar-container">
          <button class="profile__avatar-btn">
            <img
              class="profile__pencil-icon"
              src="<%=require('./images/pencil-light.svg')%>"
              alt="pencil icon"
            />
          </button>
          <img
            src="<%=require('./images/avatar.jpg')%>"
            alt="Bessie Coleman"
            class="profile__avatar"
          />
        </div>
        <div class="profile__column">
          <h1 class="profile__name">Bessie Coleman</h1>
          <p class="profile__description">Civil Aviator</p>
          <button type="button" class="profile__edit-btn">
            <img
              src="<%=require('./images/pencil.svg')%>"
              alt="pencil icon"
              class="profile__edit-btn-pencil"
            />Edit Profile
          </button>
        </div>
        <button type="button" class="profile__add-btn">
          <img
            src="<%=require('./images/plus.svg')%>"
            alt="plus icon"
            class="profile__add-btn-plus"
          />New Post
        </button>
      </section>
      <section class="cards page__section">
        <ul class="cards__list">
          <template id="card-template">
            <li class="card">
              <button class="card__delete-btn" type="button"></button>
              <img src="#" alt="" class="card__image" />
              <div class="card__content">
                <h2 class="card__title"></h2>
                <button type="button" class="card__like-btn"></button>
              </div>
            </li>
          </template>
        </ul>
      </section>
    </main>
    <footer class="footer">
      <p class="footer__copyright">2025 &copy; Spots</p>
    </footer>
    <div class="modal modal_type_preview" id="preview-modal">
      <div class="modal__image-container">
        <button class="modal__close-btn modal__close-btn_type_preview"></button>
        <img src="#" alt="" class="modal__image" />
        <p class="modal__caption"></p>
      </div>
    </div>
    <div id="edit-profile-modal" class="modal">
      <div class="modal__container">
        <button type="button" class="modal__close-btn"></button>
        <h2 class="modal__title">Edit Profile</h2>
        <form class="modal__form" novalidate>
          <label for="profile-name-input" class="modal__label">
            Name
            <input
              id="profile-name-input"
              type="text"
              class="modal__input"
              placeholder="Type your name"
              minlength="2"
              maxlength="40"
              required
            />
            <span id="profile-name-input-error" class="modal__error"></span>
          </label>
          <label for="profile-description-input" class="modal__label">
            Description
            <input
              id="profile-description-input"
              type="text"
              class="modal__input"
              placeholder="Describe yourself"
              minlength="2"
              maxlength="200"
              required
            />
            <span
              id="profile-description-input-error"
              class="modal__error"
            ></span>
          </label>
          <button
            type="submit"
            id="modal-submit"
            class="modal__submit-btn modal__submit-profile"
          >
            Save
          </button>
        </form>
      </div>
    </div>
    <div id="new-post-modal" class="modal">
      <div class="modal__container">
        <button type="button" class="modal__close-btn"></button>
        <h2 class="modal__title">New Post</h2>
        <form class="modal__form" novalidate>
          <label for="card-image-input" class="modal__label">
            Image link
            <input
              id="card-image-input"
              type="url"
              class="modal__input"
              placeholder="Paste a link to the picture"
              required
            />
            <span id="card-image-input-error" class="modal__error"></span>
          </label>
          <label for="card-caption-input" class="modal__label">
            Caption
            <input
              id="card-caption-input"
              type="text"
              class="modal__input"
              placeholder="Type your caption"
              minlength="2"
              maxlength="30"
              required
            />
            <span id="card-caption-input-error" class="modal__error"></span>
          </label>
          <button type="submit" class="modal__submit-btn modal__submit-post">
            Save
          </button>
        </form>
      </div>
    </div>
    <div class="modal" id="avatar-modal">
      <div class="modal__container">
        <button
          aria-label="Close modal"
          class="modal__close-btn"
          type="button"
        ></button>
        <h3 class="modal__title">Edit Avatar</h3>
        <form class="modal__form" id="edit-avatar-form">
          <label class="modal__label" for="profile-avatar-input"
            >Avatar
            <input
              type="url"
              id="profile-avatar-input"
              class="modal__input"
              name="avatar"
              placeholder="Paste the link to an image"
              required
            />
            <span class="modal__error" id="profile-avatar-input-error"></span>
          </label>
          <button class="modal__submit-btn" type="submit">Save</button>
        </form>
      </div>
    </div>

    <div class="modal" id="delete-modal">
      <div class="modal__container">
        <button
          aria-label="Close modal"
          class="modal__delete-close-btn"
          type="button"
        ></button>
        <h3 class="modal__title-delete">
          Are you sure you want to delete this image?
        </h3>
        <form class="modal__delete-form" id="delete-form">
          <div class="modal__delete-btn-container">
            <button class="modal__delete-btn" type="submit">Delete</button>
            <button class="modal__cancel-btn" type="button">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
